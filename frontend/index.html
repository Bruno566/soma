<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soma ou Sabota - O Jogo dos Dados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #070a13;
      color: #f8fafc;
      overflow-x: hidden;
    }

    /* 3D Dice Stage */
    .dice-stage {
      perspective: 900px;
      -webkit-perspective: 900px;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cube-dice {
      width: 88px;
      height: 88px;
      position: relative;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 1.4s cubic-bezier(0.18, 0.89, 0.32, 1.15);
    }

    .cube-face {
      position: absolute;
      width: 88px;
      height: 88px;
      background: #ffffff;
      border: 2px solid #94a3b8;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 8px;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.12), 0 4px 10px rgba(0, 0, 0, 0.3);
      user-select: none;
      pointer-events: none;
    }

    /* 88px cube -> translateZ is exactly 44px (half of 88px) */
    .face-front  { transform: rotateY(0deg) translateZ(44px); }
    .face-right  { transform: rotateY(90deg) translateZ(44px); }
    .face-back   { transform: rotateY(180deg) translateZ(44px); }
    .face-left   { transform: rotateY(-90deg) translateZ(44px); }
    .face-top    { transform: rotateX(90deg) translateZ(44px); }
    .face-bottom { transform: rotateX(-90deg) translateZ(44px); }

    .pip-dot {
      width: 15px;
      height: 15px;
      background-color: #0f172a;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.6);
    }

    .pip-dot.red {
      background-color: #dc2626;
      box-shadow: inset 0 2px 3px rgba(127, 29, 29, 0.8), 0 0 6px rgba(239, 68, 68, 0.6);
    }
  </style>
  </head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-rose-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>
</html>
